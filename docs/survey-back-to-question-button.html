<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>元に設問に戻る</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .btn-previous {
      appearance: none;
      border: 0;
      background: #e0c256;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 14px 36px;
      border-radius: 999px;
      min-width: 220px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <button class="btn-previous" type="button">元に設問に戻る</button>
  </div>
</body>
</html>
