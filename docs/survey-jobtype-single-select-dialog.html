<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>サーベイ回答ダイアログ</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    }
    .backdrop {
      min-height: 100%;
      background: #9a9a9a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .dialog {
      width: min(560px, 92vw);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
      padding: 56px 28px 40px;
    }
    .icon-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 36px;
      border: 6px solid #d9efd0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap svg {
      width: 46px;
      height: 46px;
    }
    .message {
      margin: 0 0 32px;
      color: #6b6b6b;
      font-size: 20px;
      line-height: 1.7;
      font-weight: 400;
    }
    .ok {
      appearance: none;
      border: 3px solid #c5d0e0;
      background: #c97b80;
      color: #fff;
      min-width: 92px;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="survey-dialog-message">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5l5 5L19 7.5" stroke="#8fd18a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p id="survey-dialog-message" class="message">
        職種は1つのみ選択可能なため<br />
        再度の回答をお願いします
      </p>
      <button class="ok" type="button">OK</button>
    </div>
  </div>
</body>
</html>
